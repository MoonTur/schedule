<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="구글 캘린더 일정과 Google Tasks 할 일을 한 화면에서">
<title>업무·일정</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <nav class="tabs" aria-label="화면 고르기">
      <button type="button" class="tab" data-act="view" data-view="today">오늘</button>
      <button type="button" class="tab" data-act="view" data-view="tasks">할 일</button>
      <button type="button" class="tab" data-act="view" data-view="calendar">캘린더</button>
    </nav>
    <h1 class="top-title" id="topTitle">오늘</h1>
    <div class="sync">
      <button type="button" class="sync-btn" data-act="account" aria-label="구글 연결 정보">
        <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
        <span class="sync-text" id="syncText">불러오는 중…</span>
      </button>
      <button type="button" class="icon-btn" data-act="refresh" aria-label="구글에서 새로 불러오기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
      </button>
    </div>
  </header>

  <div class="auth-banner" id="authBanner" role="status" hidden>
    <span id="authBannerText">구글 연결이 끊겼습니다. 저장하려면 다시 연결해 주세요.</span>
    <button type="button" class="btn sm primary" data-act="connect">다시 연결</button>
  </div>

  <main class="main" id="main" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="화면 고르기">
    <button type="button" class="bn" data-act="view" data-view="today">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <span>오늘</span>
    </button>
    <button type="button" class="bn" data-act="view" data-view="tasks">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
      <span>할 일</span>
    </button>
    <button type="button" class="bn" data-act="view" data-view="calendar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>캘린더</span>
    </button>
  </nav>
</div>

<dialog class="sheet" id="sheet" aria-label="입력 창"></dialog>
<dialog class="sheet confirm" id="confirmDlg" aria-label="확인"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="logic.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
